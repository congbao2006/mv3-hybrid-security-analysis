<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="720" height="376" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Proposed Empirical Research Framework for Manifest V3 Extension Security Assessment</text>

  <!-- Row 1: Data & Preparation (Stages 1-3) -->
  <rect x="20" y="42" width="235" height="68" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="137" y="61" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">1. Browser Extension Collection</text>
  <text x="137" y="77" text-anchor="middle" font-size="9.5" fill="#1e293b">Controlled (30 CB + 40 CST: 19 inh./21 auth.)</text>
  <text x="137" y="92" text-anchor="middle" font-size="9.5" fill="#1e293b">Real-World (60 CWS RWB + 20 RWM archive)</text>

  <line x1="255" y1="76" x2="288" y2="76" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="292" y="42" width="275" height="68" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="429" y="61" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">2. Dataset Audit &amp; Ground Truth Verification</text>
  <text x="429" y="77" text-anchor="middle" font-size="9.5" fill="#1e293b">ID / Version / SHA-256 audit; Dual-blind review (κ=0.700/0.863)</text>
  <text x="429" y="92" text-anchor="middle" font-size="9.5" fill="#7c2d12">Verified Primary (70 RW: 59B+11M) | 10 Unverified excluded</text>

  <line x1="567" y1="76" x2="600" y2="76" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="604" y="42" width="276" height="68" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="742" y="61" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">3. Label-Blind Artifact Preparation</text>
  <text x="742" y="77" text-anchor="middle" font-size="9.5" fill="#1e293b">MV3 check, mvx-package-v1 SHA-256, fail-closed limits</text>
  <text x="742" y="92" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b91c1c">GROUND_TRUTH_FORBIDDEN enforced before M1–M4</text>

  <!-- Arrow from Stage 3 down to Analysis Layer -->
  <path d="M 742 110 L 742 132 L 170 132 L 170 148" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="132" x2="450" y2="148" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="742" y1="132" x2="742" y2="148" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Row 2: Isolated Analysis Branches M1, M2, M3 -->
  <rect x="20" y="152" width="270" height="72" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="155" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#155e75">4a. M1: Permission-Only Analysis</text>
  <text x="155" y="186" text-anchor="middle" font-size="9.5" fill="#1e293b">manifest.json rules (MVX101–103, 110–111)</text>
  <text x="155" y="201" text-anchor="middle" font-size="9.5" fill="#1e293b">W1–W5 weights | n=150 numeric | ~25 ms</text>
  <text x="155" y="216" text-anchor="middle" font-size="9" fill="#0e7490">Feeds M5 &amp; M4 (with MVX103 deduplication)</text>

  <rect x="315" y="152" width="270" height="72" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="450" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">4b. M2: Static Source/Package Analysis</text>
  <text x="450" y="186" text-anchor="middle" font-size="9.5" fill="#1e293b">19 AST/Base64/DNR/integrity rules (M1 excluded)</text>
  <text x="450" y="201" text-anchor="middle" font-size="9.5" fill="#1e293b">W1–W5 weights | n=145 numeric (5 XML rejected)</text>
  <text x="450" y="216" text-anchor="middle" font-size="9" fill="#1d4ed8">Feeds M5 &amp; M4 (with confidence weights 1.0/0.7/0.4)</text>

  <rect x="610" y="152" width="270" height="72" rx="6" fill="#fdf2f8" stroke="#be185d" stroke-width="1.5"/>
  <text x="745" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#831843">4c. M3: Isolated Dynamic Analysis</text>
  <text x="745" y="186" text-anchor="middle" font-size="9.5" fill="#1e293b">Docker (--network none) + Chromium + 8s Canary</text>
  <text x="745" y="201" text-anchor="middle" font-size="9.5" fill="#1e293b">3× repeats (435 launches, 15 pre-M3 rejected)</text>
  <text x="745" y="216" text-anchor="middle" font-size="9" fill="#9d174d">n=135 determinate, 10 inconclusive | ~10.8 s/run</text>

  <!-- Row 3: Evidence Integration M5 (Combined Static) & M4 (Hybrid Fusion) -->
  <path d="M 155 224 L 155 256 L 195 256" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 450 224 L 450 242 L 320 242 L 320 250" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="198" y="252" width="245" height="62" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="320" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#312e81">5a. M5: Combined Static Baseline</text>
  <text x="320" y="286" text-anchor="middle" font-size="9.5" fill="#1e293b">S_static = min(100, 0.3·S_M1 + 0.7·S_M2^adj)</text>
  <text x="320" y="301" text-anchor="middle" font-size="9" fill="#3730a3">Isolates static aggregation vs dynamic value</text>

  <line x1="443" y1="283" x2="490" y2="283" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 745 224 L 745 252" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="494" y="252" width="386" height="62" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.8"/>
  <text x="687" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">5b. M4: Hybrid Evidence Integration (Formula C-2, Frozen α=0.3)</text>
  <text x="687" y="286" text-anchor="middle" font-size="9.5" fill="#1e293b">S_hybrid = min(100, max(F_TierA=90, S_static + E_dyn + B_corr))</text>
  <text x="687" y="301" text-anchor="middle" font-size="9" fill="#166534">Static fallback on M3 inconclusive | Extension-initiator guard active</text>

  <!-- Ground Truth Isolation Bypass Line (Red dashed from Stage 2 directly to Stage 6 ONLY!) -->
  <path d="M 429 110 L 429 124 L 8 124 L 8 375 L 18 375" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arrRed)"/>
  <text x="16" y="340" font-size="8.2" font-weight="bold" fill="#b91c1c" transform="rotate(-90 16 340)">Verified GT joined ONLY at Evaluation</text>

  <!-- Arrow from Stage 5 to Stage 6 -->
  <line x1="320" y1="314" x2="320" y2="342" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="687" y1="314" x2="687" y2="342" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Row 4: Comparative Evaluation, Robustness, Risk Assessment -->
  <rect x="22" y="346" width="338" height="106" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="191" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a3412">6. Comparative Evaluation (EXP01–EXP05 → RQ1–RQ4)</text>
  <text x="32" y="382" font-size="9.2" fill="#1e293b">• EXP01/03 (RQ1): M1 vs M2 + Threat Indicator Distribution</text>
  <text x="32" y="397" font-size="9.2" fill="#1e293b">• EXP02 (RQ2): M1–M5 Common-Sample (69 Ctrl / 61 Ver. RW)</text>
  <text x="32" y="412" font-size="9.2" fill="#1e293b">• EXP04 (RQ3): W1–W5 Spearman + 6 Extension Features</text>
  <text x="32" y="427" font-size="9.2" fill="#1e293b">• EXP05 (RQ4): Mean/Median/Std/P95, Coverage, 3× Stability</text>
  <text x="32" y="442" font-size="8.8" font-weight="bold" fill="#9a3412">Verified Primary (n=70 RW) + Provenance Supp. (n=80 RW)</text>

  <line x1="360" y1="399" x2="388" y2="399" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="392" y="346" width="256" height="106" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="520" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">7. Robustness &amp; Error Analysis</text>
  <text x="402" y="383" font-size="9.2" fill="#1e293b">• 8-Component M4 Ablation</text>
  <text x="402" y="398" font-size="9.2" fill="#1e293b">• Post-hoc C-2 α (0.1–0.9) &amp; Thresholds</text>
  <text x="402" y="413" font-size="9.2" fill="#1e293b">• Exact McNemar + Holm–Bonferroni</text>
  <text x="402" y="428" font-size="9.2" fill="#1e293b">• Clopper–Pearson &amp; Bootstrap 95% CIs</text>
  <text x="402" y="443" font-size="9.2" fill="#1e293b">• Case Studies (Version Drift, FP/FN)</text>

  <line x1="648" y1="399" x2="676" y2="399" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="680" y="346" width="200" height="106" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="780" y="367" text-anchor="middle" font-size="11" font-weight="bold" fill="#065f46">8. Security Risk Assessment</text>
  <text x="780" y="386" text-anchor="middle" font-size="9.3" fill="#1e293b">Two-Tier Triage Workflow:</text>
  <text x="780" y="403" text-anchor="middle" font-size="9.2" fill="#1e293b">Tier 1: Fast Static (M5, ~0.23 s)</text>
  <text x="780" y="419" text-anchor="middle" font-size="9.2" fill="#1e293b">Tier 2: Sandbox Triage (M3, ~10.8 s)</text>
  <text x="780" y="438" text-anchor="middle" font-size="8.8" font-weight="bold" fill="#047857">Transparent Threats to Validity</text>
</svg>